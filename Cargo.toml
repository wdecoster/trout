[package]
name = "trout"
version = "0.1.1"
edition = "2024"
description = "Tandem Repeat OUTlier identification based on sequence composition and length"
authors = ["Wouter De Coster <wouter.decoster@gmail.com>"]
license = "MIT"
repository = "https://github.com/wdecoster/trout"

[dependencies]
clap = { version = "4", features = ["derive"] }
dbscan = "0.3.1"
flate2 = "1"
kuva = "0.5"
log = "0.4"
env_logger = "0.11"
rayon = "1"

[target.'cfg(unix)'.dependencies]
# Used only to raise our own open-file-descriptor soft limit at startup (RLIMIT_NOFILE), so the
# all-files-open k-way merge doesn't hit the default 1024 ulimit on large cohorts.
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# For perf/flamegraph profiling: inherits release optimisations, adds DWARF symbols so
# inlined frames resolve to source line numbers.
[profile.profiling]
inherits = "release"
debug = true
