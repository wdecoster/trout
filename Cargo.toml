[package]
name = "trout"
version = "0.1.0"
edition = "2024"
description = "Tandem Repeat OUTlier identification based on sequence composition and length"
authors = ["Wouter De Coster <wouter.decoster@gmail.com>"]
license = "MIT"
repository = "https://github.com/wdecoster/trout"

[dependencies]
clap = { version = "4", features = ["derive"] }
dbscan = "0.3.1"
flate2 = "1"
kuva = "0.1"
log = "0.4"
env_logger = "0.11"
rayon = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
