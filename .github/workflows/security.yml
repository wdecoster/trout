name: Security Audit

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      run: cargo audit

    - name: Check for outdated dependencies
      run: |
        cargo install cargo-outdated --locked || echo "cargo-outdated installation failed, skipping"
        if command -v cargo-outdated >/dev/null 2>&1; then
          cargo outdated --root-deps-only || echo "cargo-outdated failed, but this is non-critical"
        fi

    - name: Install and run cargo deny
      run: |
        cargo install cargo-deny --version "0.19.7"
        cargo deny check
